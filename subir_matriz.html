<!DOCTYPE html>
<html lang="es">
<head>
    <title>Subir Matriz a Firestore</title>
</head>
<body>
    <h2>Subiendo matriz a la base de datos...</h2>
    <p>Revisa la alerta en pantalla o presiona F12 para ver la consola.</p>

    <!-- Usamos type="module" para poder importar las librerías de Firebase directamente -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE (La encuentras en Project Settings de tu consola Firebase)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 2. PEGA AQUÍ TODO TU JSON DE OH JANG GENERADO POR GEMINI
        const matrizOhJang = {
            "poomsae_id": "oh_jang",
            "criterios_generales_wt": {
                "duracion_optima_segundos": 40
            }
            // ... (Pega el resto de los pasos aquí)
        };

        // 3. Función automática de subida
        async function subirDato() {
            try {
                // Crea la colección "poomsaes" y guarda el documento con el ID "oh_jang"
                await setDoc(doc(db, "poomsaes", "oh_jang"), matrizOhJang);
                console.log("✅ ¡ÉXITO! La matriz de Oh Jang se subió a Firestore correctamente.");
                alert("Matriz subida con éxito a Firebase. Ya puedes revisar tu consola de Firebase.");
            } catch (error) {
                console.error("❌ Error al subir:", error);
                alert("Hubo un error al subir los datos. Revisa la consola (F12).");
            }
        }

        subirDato();
    </script>
</body>
</html>
